apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp-replicaset
  labels:
    app: myapp
    type: front-end
spec:
  # Just as the case with replication controller, under template goes full metadata and spec from pod defintion
  template:
    metadata:
      name: myapp-pod
      labels:
        app: myapp
        type: front-end
    spec:
      containers:
      - name: nginx-container
        image: nginx
  replicas: 3
  # Defines which pods will be under influence of replicaset
  selector:
    matchLabels:
      type: front-end