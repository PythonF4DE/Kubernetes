apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - list-of-resources.yaml
  - path-to-directory-that-contains-another-kustomization-file-with-its-resources/

# kustomize build path-to-kustomize-folder/ | kubectl apply -f -
# OR
# kubectl apply -k path-to-kustomize-folder/


# Some of the common transformers are
# commonLabels:
  # org: KodeKloud
# namePrefix/Suffix
# namePerefix: dev
# nameSuffix: -dev
# namespace: lab
# commonAnnotations:
#   - owner: riot@riotenterprise.com


# Some of the image transformers include (can be mixed!)
# images:
#   - name: nginx
#     newName: haproxy

# images:
#   - name: nginx
    # newTag: "2.4" # quote the tag!


# Some patch examples
# JSON 6902
# patches:
#   - target:
#       kind: Deployment
#       name: api-deployment

#     patch: |-
#       - op: replace
#         path: /metadata/name
#         value: webdeployment

# patches:
#   - target:
#       kind: Deployment
#       name: api-deployment
#     patch: |-
#       - op: replace
#         path: /spec/replicas
#         value: 5

# Strategic merge patch (basically beginning of a manifest file with a different replicas number)
# patches:
#   - patch: |-
#       apiVersion: apps/v1
#       kind: Deployment
#       metadata:
#         name: api-deployment
#       spec: 
#         replicas: 5

# Can also be like this
# patches:
#   - path: replica-patch.yaml
#     target:
#       kind: Deployment
#       name: nginx-deployment

# replica-patch.yaml -
# - op: replace
#   path: /spec/replicas
#   value: 5


# For a strategic merge patch
# patches:
#   - replica-patch.yaml

# replica-patch.yaml
# apiVersion: apps/v1
# kind: Deployment
# metadata:
#   name: api-deployment
# spec: 
#   replicas: 5