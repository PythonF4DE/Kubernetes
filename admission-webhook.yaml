apiVersion: admissionregistration.k8s.io/v1
kinda: ValidatingWebhookConfiguration
metadata:
  name: "pod-policy.example.com"
webhooks:
- name: "pod-policy.example.com"
  clientConfig:
    # if configured externally
    # url: "https://external-server.example.com"
    # if configured within kubernetes cluster as a pod
    service:
      namespace: "webhook-namespace"
      name: "webhook-service"
    caBundle: "sdadw...#@4sfa"
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
    scope: ["Namespaced"]